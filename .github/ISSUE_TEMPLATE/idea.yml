name: Idea
description: Suggest a feature or an improvement.
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like Islet to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help you?
      description: The situation you're in when you'd use it.
